name: Daily Screener Update

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC = 6pm EDT / 5pm EST, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json sectors.json

          if git diff --staged --quiet; then
            echo "Data unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "Update screener data $(date -u +%Y-%m-%d)"

          # The remote can move between checkout and push — a web edit, or an overlapping
          # run — which rejects a plain push. Rebase onto whatever is there, then retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
