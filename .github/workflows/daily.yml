name: Daily Screener Update

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC = 6pm EDT / 5pm EST, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json sectors.json
          git diff --staged --quiet || git commit -m "Update screener data $(date -u +%Y-%m-%d)"
          git push
